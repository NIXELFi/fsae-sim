[package]
name = "fsae-sim"
version = "0.5.0"
edition = "2021"
description = "SDM26 Driver-in-Loop: first-person FSAE simulator"
authors = ["Sun Devil Motorsports"]
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# A second launch (Helios, a double-click) focuses the running window and hands
# it the new arguments instead of starting a second process that fights the
# first for the exclusive DirectInput acquire on the wheel.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
# Already in the tree under tauri; used directly to read the wheel keyword
# list the webview also reads (src/game/wheelBrands.json).
serde_json = "1"
# The vehicle model. The same crate the JS build is checked against
# (sim/data/vehicle-golden.json); the desktop build runs it natively at 1 kHz.
sim-core = { path = "../../native/crates/sim-core" }

[target.'cfg(windows)'.dependencies]
# DirectInput for the steering-wheel force feedback (src/wheel.rs).
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_Media",
] }

[profile.release]
opt-level = "s"
# Thin LTO, not fat. Because generate_context! embeds the frontend at compile
# time, editing any .js file forces this crate to recompile and relink -- with
# fat LTO plus codegen-units=1 that was 2m24s for a one-line change, which is
# not a loop anyone will actually use. Thin LTO gives nearly the same binary
# for a fraction of the link.
lto = "thin"
strip = true

# The shell is size-optimised, but the physics is not: the rig thread steps
# the vehicle model and the force feedback at 1 kHz, and that code wants the
# full optimiser.
[profile.release.package.sim-core]
opt-level = 3
