[package]
name = "bevy-spike"
version.workspace = true
edition.workspace = true
description = "Visual spike: does the SDM26 sim look better in Bevy than in WebGL2?"

[dependencies]
sim-core = { path = "../../crates/sim-core" }
engine-audio = { path = "../../crates/engine-audio" }
# Used directly rather than through bevy_audio: this is a generator that has to
# be pulled at the device's rate forever, not an asset to decode and play.
cpal = "0.15"
bevy = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
